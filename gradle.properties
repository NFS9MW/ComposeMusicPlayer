#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# The JDK jlink and jpackage build the app image and installers from.
#
# Normally unset, and then the Gradle JVM is used. It is set on a machine whose
# Gradle JVM cannot build a runtime image at all: Fedora's OpenJDK patches
# conf/security/java.security for crypto policies without updating the hash
# recorded inside the image, and jlink refuses to build from a JDK it considers
# modified ("Error: modified .../conf/security/java.security"). Compiling,
# testing and `run` are unaffected -- only packaging reads this. Any unpatched
# JDK 25 works; the one Fedora was packaged with is
#
#   /home/rhp/.gradle/jdks/jetbrains_s_r_o_-25-amd64-linux.2
#
# The value names a directory on one machine, so it does not belong in a file
# that is copied between machines -- and it is not set here for that reason.
# Windows resolves a POSIX-looking "/home/<user>/..." against the current drive,
# so a Linux path left in this file arrives as an unrelated absolute path rather
# than as an obvious mistake, and every package task then fails before doing any
# work with only "'jdkHome' specifies directory '<path>' which doesn't exist".
#
# Set it where it applies instead. Gradle reads ~/.gradle/gradle.properties
# after this file and lets it win, so a machine that needs the override can keep
# it to itself:
#
#   cmp.packaging.javaHome=/home/rhp/.gradle/jdks/jetbrains_s_r_o_-25-amd64-linux.2
#
# build.gradle.kts ignores a value that is not a directory on the machine
# running the build, so a stale one degrades to the Gradle JVM rather than
# failing the build.
